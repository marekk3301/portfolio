<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#e8eaed">
  <!-- 18ml Miniature Dropper Bottle (Vallejo / Army Painter style) -->
