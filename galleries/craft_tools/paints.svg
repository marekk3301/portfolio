  <path d="M13.5 16.5l2 2 2.5-2.5-2-2-2.5 2.5z"/>
  <!-- Brush Handle -->
  <path d="M16.5 13.5l2 2L23 4c.3-.5.2-1.1-.3-1.4-.5-.3-1.1-.2-1.4.3l-4.8 10.6z"/>

  <!-- Paint droplets -->
