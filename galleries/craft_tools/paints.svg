  <path d="M5.5 1h2v2h-2z"/>
  <!-- Screw Cap with ridges -->
  <path d="M4.5 3h4c.3 0 .5.2.5.5v3.5h-5V3.5c0-.3.2-.5.5-.5z"/>
  <path d="M5.5 4h.8v2h-.8zm1.4 0h.8v2h-.8z" fill="#000"/>
  <!-- Bottle Neck Collar -->
  <path d="M4 7h5v1.2H4z"/>
  <!-- Bottle Body -->
  <path d="M3 8.5h7c.6 0 1 .4 1 1v11c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-11c0-.6.4-1 1-1zm1 3.5h5v5H4v-5z"/>
  <!-- Label band fill -->
  <path d="M4.5 13h4v2h-4z" fill="#000"/>

  <!-- Miniature Detail Paintbrush (Angled from top-right) -->
  <!-- Bristle Tip -->
  <path d="M12.5 17.5l2 2c.4.4.4 1 0 1.4-.4.4-1 .4-1.4 0l-2-2c-.3-.4 0-1 .4-1.4.3-.3.7-.3 1 0z"/>
